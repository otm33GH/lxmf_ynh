#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "lxmf"
name = "LXMF"
description.en = "Explain in *a few (10~15) words* the purpose of the app or what it actually does (it is meant to give a rough idea to users browsing a catalog of 100+ apps)"
description.fr = "Expliquez en *quelques* (10~15) mots l'utilité de l'app ou ce qu'elle fait (l'objectif est de donner une idée grossière pour des utilisateurs qui naviguent dans un catalogue de 100+ apps)"

version = "0.9.6~ynh1"

maintainers = ["otm33GH"]

[upstream]
license = "AGPL-3.0-only" # you can see the available licenses identifiers list here: https://spdx.org/licenses/
website = "https://example.com"
demo = "https://demo.example.com"
admindoc = "https://doc.yunohost.org/dev/packaging/"
userdoc = "https://yunohost.org/apps"
code = "https://github.com/markqvist/lxmf"


[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "amd64"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.reticulum]
    type = "app"
    filter = "match(id, '^(reticulum)(__[0-9+])?$')"
    ask.en = "Select the Reticulum app to be used with LXMF."
    ask.fr = "Sélectionnez l'app Reticulum qui sera utilisée avec LXMF."
    help.en = "You need to have aan instance of Reticulum installed beforehand on your server."
    help.fr = "Vous devez avoir une instance de Reticulum préalablement installée sur votre serveur."
    
    [install.tcp_shared_instance]
    ask.en = "Enable TCP shared instance"
    type = "boolean"
    default = false

[resources]
    [resources.system_user]

    [resources.install_dir]
       
    [resources.apt]
    packages = "build-essential python3-venv"
